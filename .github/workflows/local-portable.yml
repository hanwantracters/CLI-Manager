name: Local MSI Build

on:
  workflow_dispatch:
  push:
    branches:
      - build/283-windows-portable

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      # 本地打包配置只关闭 updater 签名产物，不需要仓库 secrets。
      - name: Build MSI
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npm run tauri -- build --config src-tauri/tauri.local.conf.json --bundles msi

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: CLI-Manager-Windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
